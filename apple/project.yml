# Generated with XcodeGen: `brew install xcodegen && xcodegen generate`
#
# The .xcodeproj is NOT checked in. It is a large generated file that conflicts
# on every merge and hides target settings in a format nobody reads — this file
# is the source of truth and the project is rebuilt from it.
name: Onyx
options:
  bundleIdPrefix: io.onyxfs
  deploymentTarget:
    macOS: "14.0"
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  OnyxKit:
    path: OnyxKit

# Set DEVELOPMENT_TEAM once here rather than in each target.
settings:
  base:
    DEVELOPMENT_TEAM: ${ONYX_TEAM_ID}
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OnyxMac:
    type: application
    platform: macOS
    sources: [OnyxMac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.onyxfs.app
        INFOPLIST_FILE: OnyxMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: OnyxMac/OnyxMac.entitlements
        # A menu-bar app: no Dock icon, no window on launch.
        LSUIElement: YES
    dependencies:
      - package: OnyxKit
      - package: OnyxKit
        product: OnyxFinderCore
      - target: OnyxFileProvider
        embed: true
      - target: OnyxFinder
        embed: true

  # Finder's right-click menu on the drives (Keep Offline, Remove Offline
  # Copy, Show in Onyx) and the marks on what is kept offline: a Finder Sync
  # extension, sandboxed, that asks the app over its Mach port
  # (OnyxFinderCore). Needs no provisioning profile. scripts/build-mac.sh
  # builds the same sources into Contents/PlugIns/OnyxFinder.appex.
  OnyxFinder:
    type: app-extension
    platform: macOS
    sources: [OnyxFinder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.onyxfs.app.findersync
        INFOPLIST_FILE: OnyxFinder/Info.plist
        # The bundle keys are generated; the NSExtension keys are the file's.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: OnyxFinder/OnyxFinder.entitlements
    dependencies:
      - package: OnyxKit
        product: OnyxFinderCore

  # Native SwiftUI: browse, search and preview the drives. iOS 18 for the
  # zoom transitions and the web sign-in session SwiftUI now has.
  OnyxIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [OnyxIOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.onyxfs.app
        # Onyx.app: what iOS calls it where it asks the person something
        # ("Onyx wants to use … to sign in"), which goes by the bundle's name.
        PRODUCT_NAME: Onyx
        INFOPLIST_FILE: OnyxIOS/Info.plist
        # The standard keys are generated and merged with Info.plist's own.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: OnyxIOS/OnyxIOS.entitlements
    dependencies:
      - package: OnyxKit
      # OnyxFileProviderIOS is embedded once the app registers its drives
      # with the Files app; until then it would be an empty extension to sign.

  # One source directory, built twice. NSFileProviderReplicatedExtension is
  # the same API on both platforms, which is the whole reason this design
  # works — but it needs a target per platform.
  OnyxFileProvider:
    type: app-extension
    platform: macOS
    sources: [OnyxFileProvider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.onyxfs.app.fileprovider
        INFOPLIST_FILE: OnyxFileProvider/Info.plist
        # The bundle keys are generated; scripts/build-mac.sh sets its own.
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: OnyxFileProvider/OnyxFileProvider.entitlements
    dependencies:
      - package: OnyxKit

  OnyxFileProviderIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [OnyxFileProvider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.onyxfs.app.fileprovider
        INFOPLIST_FILE: OnyxFileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        # An extension's version is its app's.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: OnyxFileProvider/OnyxFileProvider.entitlements
    dependencies:
      - package: OnyxKit
