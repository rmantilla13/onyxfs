<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Onyx">
  <title>Onyx</title>
  <!-- The slash from the first ONYX/FS wordmark, on the app's near-black and
       in its aura colours (lib/brand.js): electric blue into magenta into
       cyan, bottom to top, the hues "FS" is drawn in. Used wherever the logo
       has to be square: the favicon, the sign-in email, the app icon. -->
  <defs>
    <linearGradient id="onyx-slash" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3D5AFE"/>
      <stop offset="0.5" stop-color="#E040FB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0C0D0F"/>
  <path transform="translate(187 106) scale(6.1525) translate(-180.318 -5.36363)"
        d="M202.75 5.36363L189.625 54.125H180.318L193.443 5.36363H202.75Z" fill="url(#onyx-slash)"/>
</svg>
