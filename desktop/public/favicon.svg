<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Onyx">
  <title>Onyx</title>
  <!-- A cut onyx stone: an octagonal brilliant seen face-on. The table is the
       flat centre; the eight facets around it catch light at different angles,
       which is what the alternating tones represent. -->
  <rect width="512" height="512" rx="112" fill="#0C0D0F"/>
  <g transform="translate(256 256)">
    <!-- Crown facets -->
    <path d="M-150 -62 L-62 -150 L62 -150 L150 -62 L150 62 L62 150 L-62 150 L-150 62 Z" fill="#17181C"/>
    <path d="M-150 -62 L-62 -150 L-62 -62 Z" fill="#2A2C33"/>
    <path d="M62 -150 L150 -62 L62 -62 Z"   fill="#2A2C33"/>
    <path d="M150 62 L62 150 L62 62 Z"      fill="#2A2C33"/>
    <path d="M-62 150 L-150 62 L-62 62 Z"   fill="#2A2C33"/>
    <!-- Table -->
    <rect x="-62" y="-62" width="124" height="124" fill="#5B6CFF"/>
    <!-- Light across the table -->
    <path d="M-62 62 L62 -62 L62 62 Z" fill="#3D4BD4"/>
  </g>
</svg>
