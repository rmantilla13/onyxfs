<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Onyx">
  <title>Onyx</title>
  <!-- The slash from the ONYX/FS wordmark on the wordmark's near-black: the
       root of a filesystem, and the brand's accent. Used wherever the logo
       has to be square — the favicon, the sign-in email, the app icon. -->
  <rect width="512" height="512" rx="112" fill="#090B0E"/>
  <path transform="translate(187 106) scale(6.1525) translate(-180.318 -5.36363)"
        d="M202.75 5.36363L189.625 54.125H180.318L193.443 5.36363H202.75Z" fill="#99E314"/>
</svg>
